name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run core tests
        run: swift test

      - name: Check localization completeness
        run: python3 scripts/i18n-check.py

      - name: Check glossary consistency
        run: python3 scripts/glossary-check.py

      - name: Generate Xcode project
        run: make xcode

      - name: Build both variants and run parity checks
        run: bash scripts/check_variant_parity.sh
